<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% if page.page_stylesheet %}<link rel="stylesheet" href="{{ page.page_stylesheet | relative_url }}">{% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/park.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/park-interactions.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <div class="site-content-viewport">
    <div class="site-shell{% if page.shell_class %} {{ page.shell_class }}{% endif %}">
      {% include header.html %}
      <main>
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    </div>
    {% include park-scene.html %}
    <script src="{{ '/assets/js/vendor/gsap.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/park.js' | relative_url }}" defer></script>
  </body>
</html>
